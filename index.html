/* ===================================================================
   MindSpace design system — calm, organic, spatial.
   All colors use oklch. Reconstructed 1:1 from the project's styles.css.
   =================================================================== */
:root {
  --radius: 1rem;

  --background: oklch(0.975 0.011 120);
  --foreground: oklch(0.29 0.028 172);
  --card: oklch(0.995 0.006 110 / 62%);
  --card-foreground: oklch(0.29 0.028 172);
  --popover: oklch(0.99 0.008 110);
  --popover-foreground: oklch(0.29 0.028 172);

  --primary: oklch(0.55 0.062 172);
  --primary-foreground: oklch(0.985 0.008 150);
  --secondary: oklch(0.93 0.024 145);
  --secondary-foreground: oklch(0.34 0.032 172);
  --muted: oklch(0.945 0.014 130);
  --muted-foreground: oklch(0.53 0.023 165);
  --accent: oklch(0.87 0.048 285);
  --accent-foreground: oklch(0.31 0.045 285);
  --destructive: oklch(0.6 0.14 25);
  --destructive-foreground: oklch(0.985 0.008 150);

  --border: oklch(0.89 0.016 150);
  --input: oklch(0.9 0.014 150);
  --ring: oklch(0.68 0.06 172);

  --sage: oklch(0.78 0.05 145);
  --teal: oklch(0.72 0.072 190);
  --mist: oklch(0.8 0.05 240);
  --lavender: oklch(0.8 0.07 295);
  --clay: oklch(0.86 0.045 70);

  --glass: oklch(1 0 0 / 45%);
  --glass-border: oklch(1 0 0 / 65%);

  --chart-1: oklch(0.72 0.072 190);
  --chart-2: oklch(0.78 0.05 145);
  --chart-3: oklch(0.8 0.07 295);
  --chart-4: oklch(0.86 0.045 70);
  --chart-5: oklch(0.8 0.05 240);

  --font-display: "Fraunces", ui-serif, Georgia, serif;
  --font-sans: "Manrope", ui-sans-serif, system-ui, sans-serif;

  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-destructive: var(--destructive);
  --color-destructive-foreground: var(--destructive-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-sage: var(--sage);
  --color-teal: var(--teal);
  --color-mist: var(--mist);
  --color-lavender: var(--lavender);
  --color-clay: var(--clay);
  --color-glass: var(--glass);
  --color-glass-border: var(--glass-border);
  --color-chart-1: var(--chart-1);
  --color-chart-2: var(--chart-2);
  --color-chart-3: var(--chart-3);
  --color-chart-4: var(--chart-4);
  --color-chart-5: var(--chart-5);

  --gradient-canvas: radial-gradient(
      120% 90% at 12% 8%,
      color-mix(in oklab, var(--teal) 34%, transparent),
      transparent 60%
    ),
    radial-gradient(
      100% 80% at 88% 12%,
      color-mix(in oklab, var(--lavender) 32%, transparent),
      transparent 62%
    ),
    radial-gradient(
      110% 100% at 50% 108%,
      color-mix(in oklab, var(--sage) 40%, transparent),
      transparent 66%
    );
  --gradient-aura: radial-gradient(
    circle at 50% 50%,
    color-mix(in oklab, var(--teal) 45%, transparent),
    color-mix(in oklab, var(--lavender) 22%, transparent) 45%,
    transparent 72%
  );
  --gradient-soft: linear-gradient(
    140deg,
    color-mix(in oklab, var(--sage) 40%, transparent),
    color-mix(in oklab, var(--mist) 34%, transparent)
  );

  --shadow-float: 0 28px 60px -28px color-mix(in oklab, var(--primary) 34%, transparent),
    0 4px 14px -6px color-mix(in oklab, var(--primary) 16%, transparent);
  --shadow-lift: 0 42px 90px -30px color-mix(in oklab, var(--primary) 42%, transparent);
  --shadow-inner-glass: inset 0 1px 0 0 oklch(1 0 0 / 70%);
}

.dark {
  --background: oklch(0.22 0.026 200);
  --foreground: oklch(0.95 0.012 150);
  --card: oklch(0.3 0.03 200 / 55%);
  --card-foreground: oklch(0.95 0.012 150);
  --popover: oklch(0.26 0.028 200);
  --popover-foreground: oklch(0.95 0.012 150);
  --primary: oklch(0.8 0.07 175);
  --primary-foreground: oklch(0.22 0.03 190);
  --secondary: oklch(0.32 0.03 190);
  --secondary-foreground: oklch(0.95 0.012 150);
  --muted: oklch(0.31 0.024 195);
  --muted-foreground: oklch(0.76 0.02 165);
  --accent: oklch(0.45 0.06 292);
  --accent-foreground: oklch(0.95 0.012 150);
  --border: oklch(1 0 0 / 12%);
  --input: oklch(1 0 0 / 16%);
  --glass: oklch(1 0 0 / 8%);
  --glass-border: oklch(1 0 0 / 16%);
}

@keyframes breathe {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-14px) scale(1.035); }
}
@keyframes floaty {
  0%, 100% { transform: translate3d(0, 0, 0); }
  50% { transform: translate3d(0, -12px, 0); }
}
@keyframes drift {
  0% { transform: translate3d(0, 0, 0) scale(1); }
  100% { transform: translate3d(4%, -3%, 0) scale(1.08); }
}
@keyframes aura {
  0%, 100% { opacity: 0.55; transform: scale(1); }
  50% { opacity: 0.85; transform: scale(1.08); }
}
@keyframes rise {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

.h-13 { height: 3.25rem; }

.canvas-bg {
  background-color: var(--color-background);
  background-image: var(--gradient-canvas);
  background-attachment: fixed;
}
.glass-panel {
  background-color: var(--color-glass);
  border: 1px solid var(--color-glass-border);
  box-shadow: var(--shadow-float), var(--shadow-inner-glass);
  backdrop-filter: blur(22px) saturate(140%);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
}
.glass-soft {
  background-color: color-mix(in oklab, var(--color-glass) 70%, transparent);
  border: 1px solid var(--color-glass-border);
  backdrop-filter: blur(14px) saturate(130%);
  -webkit-backdrop-filter: blur(14px) saturate(130%);
}
.aura-glow {
  background-image: var(--gradient-aura);
  filter: blur(28px);
}
.blob-a { border-radius: 62% 38% 44% 56% / 52% 46% 54% 48%; }
.blob-b { border-radius: 44% 56% 62% 38% / 46% 58% 42% 54%; }
.lift-on-hover {
  transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}
.lift-on-hover:hover, .lift-on-hover:focus-visible {
  transform: translateY(-10px) scale(1.03);
  box-shadow: var(--shadow-lift);
}

/* ============ Premium modal + locked content (Workshops module) ============ */
.premium-overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  background-color: color-mix(in oklab, var(--color-foreground) 45%, transparent);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.premium-modal {
  width: 100%;
  max-width: 30rem;
  max-height: 90vh;
  overflow-y: auto;
}
.locked-panel {
  position: relative;
  overflow: hidden;
}
.locked-panel::after {
  content: '';
  position: absolute;
  inset: 0;
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  background-color: color-mix(in oklab, var(--color-glass) 35%, transparent);
  pointer-events: none;
}
.locked-tag {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  border-radius: 9999px;
  padding: 0.25rem 0.75rem;
  font-size: 0.7rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  background-color: color-mix(in oklab, var(--clay) 55%, transparent);
  color: var(--color-foreground);
}
.plan-option {
  cursor: pointer;
  transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}
.plan-option:hover { transform: translateY(-3px); }
.plan-option.selected {
  outline: 2px solid var(--color-ring);
  outline-offset: 2px;
}

.animate-breathe { animation: breathe 9s ease-in-out infinite; }
.animate-float-slow { animation: floaty 11s ease-in-out infinite; }
.animate-float-mid { animation: floaty 8s ease-in-out infinite; }
.animate-drift { animation: drift 26s ease-in-out infinite alternate; }
.animate-aura { animation: aura 7s ease-in-out infinite; }
.animate-rise { animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }

* { border-color: var(--color-border); }
html { scroll-behavior: smooth; }
body {
  background-color: var(--color-background);
  color: var(--color-foreground);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  margin: 0;
}
h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 400;
  letter-spacing: -0.015em;
}
::selection { background-color: color-mix(in oklab, var(--teal) 40%, transparent); }
:focus-visible { outline: 2px solid var(--color-ring); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}
</style>

const { useState, useEffect, useMemo, useRef } = React;
const h = React.createElement;

function cn() {
  const args = Array.prototype.slice.call(arguments);
  return args.flat(Infinity).filter(Boolean).join(' ');
}

/* ============ Hash router ============ */
function normalizeHash() {
  const raw = window.location.hash.replace(/^#/, '');
  return raw === '' ? '/' : raw;
}
function useHashRoute() {
  const [path, setPath] = useState(normalizeHash());
  useEffect(() => {
    const onHash = () => setPath(normalizeHash());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  return path;
}
function navigate(to) {
  window.location.hash = to;
  window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
}
function Link(props) {
  const { to, className, children, onClick, activeProps } = props;
  const rest = {};
  Object.keys(props).forEach((k) => {
    if (['to', 'className', 'children', 'onClick', 'activeProps'].indexOf(k) === -1) rest[k] = props[k];
  });
  const current = useHashRoute();
  const isActive = current === to;
  const activeClass = isActive && activeProps && activeProps.className ? activeProps.className : '';
  return h('a', Object.assign({
    href: '#' + to,
    className: cn(className, activeClass),
    onClick: function (e) {
      e.preventDefault();
      if (onClick) onClick(e);
      navigate(to);
    },
  }, rest), children);
}

        { emoji: "🧘", name: { en: "Practice attention reset", ta: "மன ஒருமுக பயிற்சி" }, why: { en: "Strengthens the focus recovery reflex.", ta: "கவனம் சிதறும் போது அதை மீண்டும் ஒருமுகப்படுத்த உதவுகிறது." }, action: { en: "Gently return attention to breath when wandering.", ta: "கவனம் சிதறும் போது மெதுவாக மூச்சில் கவனம் வையுங்கள்." } },
        { emoji: "🛌", name: { en: "Sleep adequately", ta: "போதுமான தூக்கம்" }, why: { en: "Sleep clears metabolic waste from the brain.", ta: "மூளையின் செயல்திறனை மீட்டெடுக்கிறது." }, action: { en: "Maintain an uninterrupted 7-8 hour sleep schedule.", ta: "தினசரி 7-8 மணி நேர ஆழ்ந்த தூக்கம் அவசியம்." } },
        { emoji: "💧", name: { en: "Stay hydrated", ta: "நீரேற்றம்" }, why: { en: "Mild dehydration impairs concentration.", ta: "உடல் வறட்சி கவனக்குறைவை உண்டாக்கும்." }, action: { en: "Keep a water bottle on your desk and sip regularly.", ta: "அடிக்கடி தண்ணீர் குடித்து உடலை நீரேற்றமாக வையுங்கள்." } },

        { emoji: "👨‍🏫", name: { en: "Seek academic mentorship", ta: "வழிகாட்டுதல் பெறுதல்" }, why: { en: "Resolves conceptual bottlenecks quickly.", ta: "சந்தேகங்களை உடனுக்குடன் தீர்த்துக்கொள்ள உதவுகிறது." }, action: { en: "Consult teachers or mentors for guidance.", ta: "ஆசிரியர்களிடம் தயங்காமல் வழிகாட்டல் பெறுங்கள்." } }

    {
      id: 6, icon: "😤", key: "anger",
      title: { en: "6. Anger Management", ta: "6. கோப மேலாண்மை" },
      desc: { en: "De-escalation protocols for intense emotional triggers.", ta: "தீவிர கோபத்தை கட்டுப்படுத்தி அமைதி காக்கும் உத்திகள்." },
      items: [
        { emoji: "⏸️", name: { en: "Pause before reacting", ta: "உடனடி எதிர்வினையை தவிர்த்தல்" }, why: { en: "Allows the prefrontal cortex to intercept impulses.", ta: "சிந்திக்காமல் எதிர்வினையாற்றுவதைத் தடுக்கிறது." }, action: { en: "Count 10 seconds before replying.", ta: "பேசுவதற்கு முன் 10 விநாடிகள் மனதிற்குள் எண்ணுங்கள்." } },
        { emoji: "🫁", name: { en: "Take slow diaphragmatic breaths", ta: "ஆழ்ந்த மூச்சு" }, why: { en: "Lowers visceral adrenaline surge.", ta: "அட்ரினலின் வேகத்தைக் குறைத்து அமைதிப்படுத்துகிறது." }, action: { en: "Take 3 deep belly breaths immediately.", ta: "உடனடியாக 3 ஆழ்ந்த மூச்சுப் பயிற்சிகளை செய்யுங்கள்." } },
        { emoji: "🚪", name: { en: "Step away from the situation", ta: "இடத்தை விட்டு விலகுதல்" }, why: { en: "Physical distance interrupts conflict escalation.", ta: "மோதல் பெரிதாவதை உடனே தடுக்கிறது." }, action: { en: "Excuse yourself politely for 5 minutes.", ta: "5 நிமிடங்களுக்கு அந்த இடத்தை விட்டு விலகி இருங்கள்." } },
        { emoji: "🔍", name: { en: "Identify underlying triggers", ta: "காரணங்களை கண்டறிதல்" }, why: { en: "Uncovers vulnerability beneath rage.", ta: "கோபத்திற்கு பின்னால் உள்ள உண்மையான வலியை அறிய உதவுகிறது." }, action: { en: "Note what specific expectation was unmet.", ta: "எந்த எதிர்பார்ப்பு ஏமாற்றமளித்தது என யோசியுங்கள்." } },
        { emoji: "🗣️", name: { en: "Express feelings assertively", ta: "அமைதியாக வெளிப்படுத்துதல்" }, why: { en: "Clear communication resolves disputes constructively.", ta: "சண்டையின்றி பிரச்சனையை சுமூகமாக முடிக்கிறது." }, action: { en: "Use 'I feel...' statements rather than blame.", ta: "பழியை சுமத்தாமல் உங்கள் உணர்வை பக்குவமாக கூறுங்கள்." } },
        { emoji: "📄", name: { en: "Write thoughts down", ta: "எழுதி தீர்த்தல்" }, why: { en: "Safely drains aggressive impulses.", ta: "ஆக்ரோஷத்தை பிறரிடம் காட்டாமல் வடிய வைக்கிறது." }, action: { en: "Write down angry thoughts and tear the paper.", ta: "கோபத்தை ஒரு தாளில் எழுதி பின்னர் அதை கிழித்துப் போடுங்கள்." } },
        { emoji: "🏃", name: { en: "Go for a walk or run", ta: "உடற்பயிற்சி" }, why: { en: "Channels fight-or-flight kinetic energy.", ta: "உடலில் உள்ள அதிகப்படியான ஆற்றலை வெளியேற்றுகிறது." }, action: { en: "Take a fast 10-minute walk outside.", ta: "10 நிமிடங்கள் வேகமான நடைப்பயிற்சி செய்யுங்கள்." } },
        { emoji: "💆", name: { en: "Conscious muscle relaxation", ta: "தசை தளர்வு பயிற்சி" }, why: { en: "Releases tension held in jaws and fists.", ta: "தாடை மற்றும் கைகளில் உள்ள இருக்கத்தை தளர்த்துகிறது." }, action: { en: "Consciously loosen shoulders and uncurl fists.", ta: "தோள்களையும் விரல்களையும் தளர்த்தி வையுங்கள்." } },
        { emoji: "👥", name: { en: "Debrief with someone trusted", ta: "நம்பகமானவரிடம் பேசுதல்" }, why: { en: "Provides an objective perspective.", ta: "விஷயங்களை நடுநிலையாகப் பார்க்க உதவுகிறது." }, action: { en: "Discuss the incident once your heart rate normalizes.", ta: "மனம் குளிர்ந்த பிறகு நண்பரிடம் விவாதிக்கவும்." } },
        { emoji: "🩺", name: { en: "Seek professional guidance", ta: "தொழில்முறை வழிகாட்டுதல்" }, why: { en: "Treats chronic emotional dysregulation.", ta: "தொடர் கோபப் பிரச்சனைகளுக்கு நிரந்தர தீர்வு தருகிறது." }, action: { en: "Consult a counselor if anger impairs relationships.", ta: "கோபம் வாழ்க்கையை பாதித்தால் மருத்துவரை அணுகவும்." } }
      ]

    {
      id: 7, icon: "💭", key: "overthinking",

      items: [
        { emoji: "✍️", name: { en: "Write repetitive loops down", ta: "எண்ணங்களை எழுதுதல்" }, why: { en: "Dislodges cyclical thoughts from working memory.", ta: "சுழலும் எண்ணங்களை மூளையிலிருந்து விடுவிக்கிறது." }, action: { en: "Put looping worries on physical paper.", ta: "மனதை வாட்டும் எண்ணங்களை ஒரு தாளில் எழுதுங்கள்." } },
        { emoji: "⚖️", name: { en: "Separate facts from assumptions", ta: "உண்மை vs அனுமானம்" }, why: { en: "Most ruminations are unproven catastrophic simulations.", ta: "பெரும்பாலான கவலைகள் கற்பனையானவையே." }, action: { en: "Underline proven facts and cross out assumptions.", ta: "நிரூபிக்கப்பட்ட உண்மைகளை மட்டும் தனியாகப் பிரிக்கவும்." } },
        { emoji: "🎯", name: { en: "Focus on controllable actions", ta: "கட்டுப்படுத்தக்கூடியவை" }, why: { en: "Worrying about uncontrollable factors drains energy.", ta: "கட்டுப்படுத்த முடியாதவற்றை நினைத்து கவலைப்படுவதை தவிர்க்கிறது." }, action: { en: "Execute only your next direct actionable task.", ta: "உங்கள் கட்டுப்பாட்டில் உள்ள அடுத்த வேலையை செய்யுங்கள்." } },
        { emoji: "☁️", name: { en: "Practice cognitive defusion", ta: "விழிப்புணர்வு" }, why: { en: "Decouples your identity from spontaneous thoughts.", ta: "எண்ணங்கள் வெறும் எண்ணங்களே என்பதை உணர வைக்கிறது." }, action: { en: "Observe thoughts as passing clouds without reacting.", ta: "எண்ணங்களை வேடிக்கை மட்டும் பாருங்கள், எதிர்வினையாற்றாதீர்கள்." } },
        { emoji: "🔄", name: { en: "Change physical environment", ta: "குறுகிய ஓய்வு" }, why: { en: "A sensory change interrupts the mental groove.", ta: "சுற்றுச்சூழல் மாற்றம் சிந்தனை சுழற்சியை உடைக்கிறது." }, action: { en: "Walk into another room or wash your face with cold water.", ta: "வேறு அறைக்கு செல்லுங்கள் அல்லது முகத்தை குளிர்ந்த நீரால் கழுவுங்கள்." } },
        { emoji: "🗣️", name: { en: "Get an objective external check", ta: "நம்பகமானவரிடம் பகிர்தல்" }, why: { en: "An outside voice punctures catastrophic bias.", ta: "மற்றொருவரின் கருத்து வீண் பயத்தை போக்கும்." }, action: { en: "Ask a friend: 'Am I over-analyzing this situation?'", ta: "நண்பரிடம் கேட்டு உண்மையான சூழலை உணருங்கள்." } },
        { emoji: "📴", name: { en: "Avoid compulsive checking", ta: "சரிபார்ப்பதை தவிர்த்தல்" }, why: { en: "Compulsive reassurance reinforces anxious loops.", ta: "மீண்டும் மீண்டும் சரிபார்ப்பது பயத்தை அதிகரிக்கும்." }, action: { en: "Refrain from checking messages or status repeatedly.", ta: "செய்திகளை திரும்பத் திரும்ப பார்ப்பதை தவிருங்கள்." } },
        { emoji: "📅", name: { en: "Maintain direct action routines", ta: "செயலில் இறங்குதல்" }, why: { en: "Constructive action is the strongest antidote to rumination.", ta: "செயல்பாடு அதீத சிந்தனையை போக்கும் அருமருந்து." }, action: { en: "Jump straight into your planned timetable.", ta: "திட்டமிட்ட பணிகளில் உடனடியாக இறங்குங்கள்." } },
        { emoji: "🎨", name: { en: "Engage in tactile activities", ta: "ஓய்வு தரும் செயல்" }, why: { en: "Engages the motor cortex over the default mode network.", ta: "உடல் சார்ந்த செயல்பாடுகள் மூளையை திசைதிருப்பும்." }, action: { en: "Sketch, clean a shelf, or organize your workspace.", ta: "மேஜையை அடுக்கி வையுங்கள் அல்லது ஏதேனும் ஓவியம் வரையுங்கள்." } },
        { emoji: "🩺", name: { en: "Consider CBT counseling", ta: "CBT சிகிச்சை" }, why: { en: "Teaches systematic cognitive restructuring techniques.", ta: "எதிர்மறை எண்ணங்களை நேர்மறையாக மாற்ற பயிற்சி தருகிறது." }, action: { en: "Work with a certified therapist on thought patterns.", ta: "சிந்தனை சுழற்சியை மாற்ற மனநல மருத்துவரிடம் பேசுங்கள்." } }
      ]
    },
    {
      id: 8, icon: "📚", key: "pressure",

      desc: { en: "Strategic workload optimization and burnout prevention.", ta: "பணிச்சுமை மற்றும் தேர்வு அழுத்தத்தை எதிர்கொள்ளும் திட்டங்கள்." },
      items: [
        { emoji: "🗓️", name: { en: "Create a realistic timetable", ta: "நடைமுறை கால அட்டவணை" }, why: { en: "Prevents overambitious planning debt.", ta: "நடைமுறைக்கு சாத்தியமான திட்டமிடலை தருகிறது." }, action: { en: "Build a 20% time buffer into daily schedules.", ta: "அட்டவணையில் 20% கூடுதல் நேரத்தை ஒதுக்குங்கள்." } },
        { emoji: "✂️", name: { en: "Divide large deliverables", ta: "பெரிய பணிகளை பிரித்தல்" }, why: { en: "Lowers psychological friction to starting.", ta: "வேலையை தொடங்குவதில் உள்ள தயக்கத்தை நீக்குகிறது." }, action: { en: "Split syllabus into 30-minute micro modules.", ta: "பாடத்திட்டங்களை 30 நிமிட பகுதிகளாக பிரியுங்கள்." } },
        { emoji: "⏸️", name: { en: "Take scheduled micro-breaks", ta: "தொடர் ஓய்வு" }, why: { en: "Preserves cognitive endurance across hours.", ta: "மூளையின் கற்கும் திறனை நீண்ட நேரம் தக்கவைக்கிறது." }, action: { en: "Take 10 minutes of rest after every hour of study.", ta: "ஒவ்வொரு மணி நேரத்திற்கும் 10 நிமிட ஓய்வு எடுங்கள்." } },

function BreathingOrb() {
  const [running, setRunning] = useState(false);
  const [phase, setPhase] = useState('Breathe in');

  useEffect(function () {
    if (!running) return;
    const seq = ['Breathe in', 'Hold', 'Breathe out', 'Hold'];
    let i = 0;
    const id = setInterval(function () { i = (i + 1) % seq.length; setPhase(seq[i]); }, 4000);
    return function () { clearInterval(id); };
  }, [running]);

  return h(Panel, { className: 'flex flex-col items-center justify-center text-center' },
    h('div', { className: 'relative grid h-56 w-56 place-items-center' },
      h('div', { className: 'absolute inset-0 blob-a bg-gradient-to-br from-teal/60 to-lavender/50 blur-xl ' + (running ? 'animate-breathe' : '') }),
      h('div', { className: 'glass-panel relative grid h-40 w-40 place-items-center blob-b ' + (running ? 'animate-breathe' : '') },
        h('span', { className: 'font-display text-lg' }, running ? phase : 'Ready')
      )
    ),
    h(ActionButton, { variant: 'primary', className: 'mt-8', onClick: function () { setRunning(function (v) { return !v; }); }, 'aria-pressed': running },
      running ? 'Pause exercise' : 'Start Exercise'),
    h('p', { className: 'mt-3 text-xs text-muted-foreground' }, 'Box breathing · 4 seconds each phase')
  );
}

          );

      )

        eyebrow: 'Learn at your pace', title: 'Self-paced courses',
        lead: premium ? 'All courses are unlocked for you.' : 'Start with a free course, or get Premium to unlock the full library.',
      }),

            ),

            h('p', { className: 'mt-1 text-xs text-muted-foreground' }, c.desc),
            unlocked
              ? h(ActionButton, { size: 'sm', variant: 'outline', className: 'mt-4' }, 'Start course')
              : h(LockedNotice, { onUnlock: requestUnlock })
          );
        })
      )
    ),
    showPremium ? h(PremiumModal, { onClose: function () { setShowPremium(false); }, onUnlock: completeUnlock }) : null
  );
}

/* ============ AuthScreen (login / create account / forgot password) ============ */
function AuthScreen(props) {
  const onSuccess = props.onSuccess;
  const [mode, setMode] = useState('login');
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [fullName, setFullName] = useState('');
  const [email, setEmail] = useState('');
  const [resetEmail, setResetEmail] = useState('');
  const [newPassword, setNewPassword] = useState('');
  const [message, setMessage] = useState(null);

  function switchMode(next) { setMode(next); setMessage(null); }

  function submitAuth(e) {
    e.preventDefault();
    if (!username.trim()) { setMessage({ type: 'error', text: 'Please enter your username.' }); return; }
    if (!password.trim()) { setMessage({ type: 'error', text: 'Please enter your password.' }); return; }

    if (mode === 'create') {
      if (!fullName.trim()) { setMessage({ type: 'error', text: 'Please enter your full name.' }); return; }
      if (!email.trim() || email.indexOf('@') === -1) { setMessage({ type: 'error', text: 'Please enter a valid email address.' }); return; }
      if (password.trim().length < 4) { setMessage({ type: 'error', text: 'Password must be at least 4 characters.' }); return; }
      try {
        window.localStorage.setItem(AUTH_KEYS.username, username.trim());
        window.localStorage.setItem(AUTH_KEYS.password, password.trim());
        window.localStorage.setItem(AUTH_KEYS.fullName, fullName.trim());
        window.localStorage.setItem(AUTH_KEYS.email, email.trim());
        window.localStorage.setItem(AUTH_KEYS.loggedIn, '1');
      } catch (err) {}
      setMessage({ type: 'success', text: 'Account created — welcome to MindSpace.' });
      setTimeout(function () { onSuccess(); }, 450);
      return;
    }

    let storedUser = null, storedPass = null;
    try {
      storedUser = window.localStorage.getItem(AUTH_KEYS.username);
      storedPass = window.localStorage.getItem(AUTH_KEYS.password);
    } catch (err) {}
    if (!storedUser || !storedPass) { setMessage({ type: 'error', text: 'No account found on this device yet — create one first.' }); return; }
    if (username === storedUser && password === storedPass) {
      try { window.localStorage.setItem(AUTH_KEYS.loggedIn, '1'); } catch (err) {}
      setMessage({ type: 'success', text: 'Welcome back, ' + username + '.' });
      setTimeout(function () { onSuccess(); }, 350);
    } else {
      setMessage({ type: 'error', text: 'Incorrect username or password. Please try again.' });
    }
  }

  function submitReset(e) {
    e.preventDefault();
    if (!resetEmail.trim() || resetEmail.indexOf('@') === -1) { setMessage({ type: 'error', text: 'Enter a valid registered email address.' }); return; }
    if (!newPassword.trim() || newPassword.trim().length < 4) { setMessage({ type: 'error', text: 'New password must be at least 4 characters.' }); return; }
    let storedEmail = '';
    try { storedEmail = (window.localStorage.getItem(AUTH_KEYS.email) || '').toLowerCase(); } catch (err) {}
    if (!storedEmail || resetEmail.trim().toLowerCase() !== storedEmail) { setMessage({ type: 'error', text: 'That email was not found on this device.' }); return; }
    try { window.localStorage.setItem(AUTH_KEYS.password, newPassword.trim()); } catch (err) {}
    setMessage({ type: 'success', text: 'Password updated. Sign in with your new password.' });
    setTimeout(function () { switchMode('login'); setPassword(''); }, 900);
  }

  const fieldClass = 'glass-soft mt-1.5 h-11 w-full rounded-2xl px-4 text-sm outline-none placeholder:text-muted-foreground/70';
  const msgStyle = message ? { color: message.type === 'error' ? 'var(--color-destructive)' : 'var(--color-primary)' } : null;

  return h('div', { className: 'relative flex min-h-screen items-center justify-center px-4 py-12' },
    h(Atmosphere, { particles: 14 }),
    h('div', { className: 'animate-rise w-full max-w-md' },
      h('div', { className: 'text-center' },
        h('span', { className: 'mx-auto grid h-14 w-14 place-items-center blob-a bg-gradient-to-br from-teal to-lavender text-2xl' }, '❂'),
        h('h1', { className: 'mt-5 font-display text-4xl' }, 'MindSpace'),
        h('p', { className: 'mt-2 text-sm text-muted-foreground' }, 'Pause. Breathe. Understand. Connect. Grow.')
      ),
      h(Panel, { className: 'mt-8' },
        mode !== 'forgot' ? h('div', { className: 'glass-soft flex gap-1 rounded-full p-1' },
          h('button', { type: 'button', onClick: function () { switchMode('login'); }, className: actionClasses(mode === 'login' ? 'primary' : 'ghost', 'sm', 'flex-1') }, 'Log In'),
          h('button', { type: 'button', onClick: function () { switchMode('create'); }, className: actionClasses(mode === 'create' ? 'primary' : 'ghost', 'sm', 'flex-1') }, 'Create Account')
        ) : null,

        mode === 'forgot'
          ? h('form', { className: 'mt-6', onSubmit: submitReset },
              h(SectionTitle, { eyebrow: 'Reset password', title: 'Recover access' }),
              h('label', { className: 'mt-6 block' },
                h('span', { className: 'text-sm text-muted-foreground' }, 'Registered email'),
                h('input', { type: 'email', value: resetEmail, onChange: function (e) { setResetEmail(e.target.value); }, placeholder: 'you@college.edu', className: fieldClass })
              ),
              h('label', { className: 'mt-4 block' },
                h('span', { className: 'text-sm text-muted-foreground' }, 'New password'),
                h('input', { type: 'password', value: newPassword, onChange: function (e) { setNewPassword(e.target.value); }, placeholder: '••••••••', className: fieldClass })
              ),
              message ? h('p', { className: 'mt-4 text-sm', style: msgStyle }, message.text) : null,
              h(ActionButton, { type: 'submit', variant: 'primary', size: 'lg', className: 'mt-6 w-full' }, 'Reset password'),
              h('button', { type: 'button', onClick: function () { switchMode('login'); }, className: 'mt-4 w-full text-center text-sm text-muted-foreground hover:text-foreground' }, '← Back to log in')
            )
          : h('form', { className: 'mt-6', onSubmit: submitAuth },
              mode === 'create' ? h(React.Fragment, null,
                h('label', { className: 'block' },
                  h('span', { className: 'text-sm text-muted-foreground' }, 'Full name'),
                  h('input', { value: fullName, onChange: function (e) { setFullName(e.target.value); }, placeholder: 'e.g. Sanjay Kumar', className: fieldClass })
                ),
                h('label', { className: 'mt-4 block' },
                  h('span', { className: 'text-sm text-muted-foreground' }, 'Email'),
                  h('input', { type: 'email', value: email, onChange: function (e) { setEmail(e.target.value); }, placeholder: 'you@college.edu', className: fieldClass })
                )
              ) : null,
              h('label', { className: 'mt-4 block' },
                h('span', { className: 'text-sm text-muted-foreground' }, 'Username'),
                h('input', { value: username, onChange: function (e) { setUsername(e.target.value); }, placeholder: 'e.g. Aakash or user123', className: fieldClass })
              ),
              h('label', { className: 'mt-4 block' },
                h('span', { className: 'text-sm text-muted-foreground' }, 'Password'),
                h('input', { type: 'password', value: password, onChange: function (e) { setPassword(e.target.value); }, placeholder: 'Enter your password', className: fieldClass })
              ),
              mode === 'login' ? h('div', { className: 'mt-2 text-right' },
                h('button', { type: 'button', onClick: function () { switchMode('forgot'); }, className: 'text-xs font-medium text-primary hover:text-foreground' }, 'Forgot password?')
              ) : null,
              message ? h('p', { className: 'mt-4 text-sm', style: msgStyle }, message.text) : null,
              h(ActionButton, { type: 'submit', variant: 'primary', size: 'lg', className: 'mt-6 w-full' }, mode === 'create' ? 'Create account' : 'Secure log in')
            )
      ),
      h('p', { className: 'mt-6 text-center text-xs text-muted-foreground' }, 'MindSpace supports wellbeing. It does not diagnose or replace professional care.')
    )
  );
}
function AuthGate() {
  const [authed, setAuthed] = useState(function () { return isAuthed(); });
  if (!authed) return h(AuthScreen, { onSuccess: function () { setAuthed(true); } });
  return h(App, null);
}

/* ============ Route table + App ============ */
const routeTable = {
  '/': Dashboard,
  '/mood': MoodPage,
  '/assistant': AssistantPage,
  '/meditation': MeditationPage,
  '/therapy': TherapyPage,
  '/community': CommunityPage,
  '/progress': ProgressPage,
  '/workshops': WorkshopsPage,
  '/achievements': AchievementsPage,
};

function App() {
  const path = useHashRoute();
  const Page = routeTable[path] || NotFoundPage;
  return h(Page, null);
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(h(AuthGate, null));
</script>
